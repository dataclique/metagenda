name: Verify portable fj

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-fj-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fj (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
          - system: x86_64-darwin
            runner: macos-15-intel
    env:
      NIX_SYSTEM: ${{ matrix.system }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
      - name: Verify native system
        shell: bash
        run: |
          set -euo pipefail
          actual_system="$(nix --accept-flake-config eval --impure --raw --expr builtins.currentSystem)"
          test "$actual_system" = "$NIX_SYSTEM"
      - name: Build fj with isolated tests
        run: nix --accept-flake-config build --no-link --print-build-logs ".#packages.${NIX_SYSTEM}.fj"
      - name: Verify canonical backlog package
        run: nix --accept-flake-config build --no-link --print-build-logs ".#checks.${NIX_SYSTEM}.work-core"
      - name: Check installed entry point
        run: nix --accept-flake-config run .#fj -- help
      - name: Install frozen JavaScript dependencies
        run: nix --accept-flake-config shell --inputs-from . nixpkgs#bun --command bun install --frozen-lockfile --ignore-scripts
      - name: Verify existing CLI and receiving contracts
        run: nix --accept-flake-config shell --inputs-from . nixpkgs#bun nixpkgs#nodejs_26 nixpkgs#nushell --command bun run verify
